<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Perfect Match – Close Reading (EN31)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#171E33; --night2:#0E1326; --rail:#1F2740; --line:#2B3454;
  --paper:#F5F4F0; --paper2:#E6E4DC; --ink:#1C2030; --ink2:#4B5165;
  --amber:#F2B347; --amber2:#B97A12; --dusk:#D1563F; --mist:#B4BDD8; --mist2:#7E89A8;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font-family:var(--sans);font-size:18px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible,.seg:focus-visible{outline:3px solid #9BD1FF;outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;line-height:1.2}
p{margin:0 0 .7em}
ul,ol{margin:0 0 .7em;padding-left:1.3em}
li{margin:.2em 0}

#stage{position:fixed;inset:0 0 58px 0;overflow:hidden}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(16px,2.5vw,40px);padding:clamp(14px,3vh,36px) clamp(14px,4vw,56px);overflow:auto;align-content:start}
.slide.two{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);align-items:stretch;align-content:stretch}
.slide.center{align-content:center;justify-items:center}

/* paper = the text/reading panel */
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:clamp(18px,3vh,34px) clamp(18px,3vw,44px);overflow:auto;min-height:0;font-family:var(--serif);font-size:clamp(17px,1.5vw,23px);line-height:1.5;box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.paper.sans{font-family:var(--sans);font-size:clamp(16px,1.25vw,20px);line-height:1.5}
.paper h2{font-size:1.5em;margin-bottom:.5em}
.paper h3{font-size:1.1em;margin:.9em 0 .3em}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--sans);font-size:.72em;color:var(--ink2);border-bottom:1px solid var(--paper2);padding-bottom:.5em;margin-bottom:1em}
.ph b{color:var(--ink);font-size:1.15em}
.ln{display:grid;grid-template-columns:2.3em minmax(0,1fr)}
.ln .n{font-family:var(--sans);font-size:.68em;color:var(--mist2);text-align:right;padding-right:1em;padding-top:.45em;user-select:none}
.ln.i .t{font-style:italic}
.ln.gap{margin-top:.6em}
mark.v{background:transparent;color:inherit;border-bottom:2px dotted transparent;padding:0 1px;transition:background .3s,border-color .3s}
.show-v mark.v{border-bottom-color:var(--amber2);background:rgba(242,179,71,.26)}
.prose{max-width:68ch}

/* rail = tasks beside the text */
.rail{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;min-width:0}
.rb{background:var(--rail);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-size:clamp(15px,1.15vw,18px)}
.rb h3{font-size:1.25em;color:var(--amber);margin-bottom:.4em}
.rb h3 small{font-family:var(--sans);font-weight:400;font-size:.6em;color:var(--mist2);margin-left:.5em}
.rb p,.rb li{color:#E7EAF3}
.rb .hint{color:var(--mist);font-size:.92em}
.routine{display:flex;gap:6px;flex-wrap:wrap}
.routine span{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mist2)}
.routine span.cur{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:700}
.routine span.done{color:var(--mist);border-color:var(--mist2)}
.show-v .routine .p-read{background:transparent;border-color:var(--mist2);color:var(--mist);font-weight:400}
.show-v .routine .p-words{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:700}

/* reveals */
.rv{display:none}
.rv.on{display:block;animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv.on{animation:none}}

/* vocabulary cards */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:.5em 0}
.vc{text-align:left;background:var(--night2);border:1px solid var(--line);border-radius:6px;padding:9px 11px;line-height:1.3;display:block;width:100%}
.vc .w{font-family:var(--serif);font-size:1.05em;display:block}
.vc .l{color:var(--mist2);font-size:.78em}
.vc .m{display:none;margin-top:7px;font-size:.9em;color:#E7EAF3}
.vc .m .de{color:var(--amber);display:block;margin-top:2px}
.vc.flipped{border-color:var(--amber)}
.vc.flipped .m{display:block}
.ghost{background:transparent;border:1px solid var(--mist2);color:var(--mist);border-radius:6px;padding:6px 12px;font-size:.9em}
.ghost:hover{border-color:var(--amber);color:var(--amber)}

/* check questions */
.qa{margin:0 0 14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.qa:last-child{border:0}
.q{font-weight:700;color:#fff}
.a{margin-top:6px;padding:8px 12px;border-left:3px solid var(--amber);background:rgba(242,179,71,.08);border-radius:0 6px 6px 0}
.a cite{font-style:normal;color:var(--mist);font-size:.88em}

/* gist */
.frame{font-family:var(--serif);font-style:italic;color:var(--mist);margin:.3em 0 .8em}
.model{font-family:var(--serif);font-size:1.12em;line-height:1.45;padding:10px 14px;border-left:3px solid var(--amber);background:rgba(242,179,71,.08);border-radius:0 6px 6px 0;margin:.4em 0}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:.4em 0}
.kw span{background:var(--night2);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:.9em}

/* cover */
.slide.cover{padding:0;display:block}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,19,38,0) 30%,rgba(14,19,38,.55) 60%,rgba(14,19,38,.92) 100%)}
.cover .copy{position:absolute;left:clamp(24px,6vw,96px);right:clamp(24px,6vw,96px);bottom:clamp(28px,8vh,90px);max-width:900px;font-family:var(--serif);font-size:clamp(20px,2.6vw,36px);line-height:1.3;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.cover .copy p{margin:0 0 .5em}
.cover .copy .ask{color:var(--amber);font-size:1.15em;font-weight:600}
.cover .credit{position:absolute;right:14px;top:10px;font-size:12px;color:rgba(255,255,255,.55)}

/* big quote / title slides */
.big{text-align:center;max-width:1000px}
.big h1{font-size:clamp(34px,5vw,72px);line-height:1.1}
.big .sub{color:var(--mist);font-size:clamp(18px,1.8vw,24px);margin-top:.8em}
.quote{font-family:var(--serif);font-size:clamp(28px,4vw,56px);line-height:1.25;text-align:center;max-width:1000px}
.quote .amb{color:var(--amber)}

/* intro / routine */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:.6em 0}
@media (max-width:1100px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{background:#fff;border:1px solid var(--paper2);border-top:4px solid var(--amber);border-radius:6px;padding:14px 16px;color:var(--ink);line-height:1.45}
.step b{display:block;font-family:var(--serif);font-size:1.4em;color:var(--amber2);margin-bottom:.3em}

/* timeline (context slide) */
.tl{display:grid;grid-template-columns:7em 1fr 1fr;gap:0 16px;font-size:clamp(15px,1.3vw,20px)}
.tl .h{color:var(--mist2);font-size:.8em;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tl .row{display:contents}
.tl .row>div{padding:7px 0;border-bottom:1px dashed var(--line)}
.tl .tm{font-family:var(--serif);font-weight:600;color:var(--amber)}
.tl .ev{color:#E7EAF3}
.tl .dad{font-family:var(--serif);font-style:italic;color:var(--mist)}
.tl .row.mark .tm{color:var(--dusk)}

/* gist board */
.board{display:grid;grid-template-columns:5.5em 1fr;gap:4px 16px;max-width:1100px;font-size:clamp(15px,1.3vw,20px)}
.board .lab{font-family:var(--serif);color:var(--amber);font-weight:600;text-align:right}
.board .lab small{display:block;color:var(--mist2);font-size:.7em;font-weight:400}
.board .g{padding-bottom:10px;border-bottom:1px dashed var(--line);font-family:var(--serif)}

/* writing */
textarea.write{width:100%;min-height:200px;resize:vertical;font-family:var(--serif);font-size:1em;line-height:1.5;padding:12px 14px;border:1px solid var(--paper2);border-radius:6px;background:#fff;color:var(--ink)}
.wfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--sans);font-size:.8em;color:var(--ink2);margin-top:6px}
.opt{border:1px solid var(--paper2);border-radius:6px;padding:12px 14px;margin:0 0 10px}
.opt b{font-family:var(--serif);font-size:1.1em;display:block;margin-bottom:.2em}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank span{background:var(--night2);border:1px solid var(--line);border-radius:4px;padding:2px 9px;font-size:.92em}
.paper .btn{font-family:var(--sans);background:var(--ink);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:.85em}

/* teacher notes */
.tn{display:none}
body.teacher .tn{display:block;position:fixed;right:16px;bottom:72px;width:min(400px,calc(100vw - 32px));max-height:45vh;overflow:auto;background:#FFF7E3;color:#3A2E12;border-left:4px solid var(--amber2);padding:12px 14px;border-radius:6px;font-size:14px;line-height:1.4;z-index:5;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.tn b{display:block;margin-bottom:4px}
.tn ul{margin:0;padding-left:1.1em}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;background:var(--night2);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px;font-size:14px;color:var(--mist);z-index:6;transition:background .3s}
#bar.flash{background:var(--amber2)}
#bar .title{font-family:var(--serif);color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{display:flex;gap:3px;flex:1;max-width:560px;min-width:120px}
.seg{height:7px;flex:1;background:#2A3352;border-radius:3px;cursor:pointer;border:0;padding:0}
.seg.done{background:var(--amber2)}
.seg.cur{background:var(--amber)}
.where{white-space:nowrap}
.bbtn{background:transparent;border:1px solid var(--line);color:var(--mist);border-radius:6px;padding:5px 10px;font-size:13px}
.bbtn:hover,.bbtn.on{border-color:var(--amber);color:var(--amber)}
.timer{display:flex;gap:4px;align-items:center}
.timer .bbtn{padding:5px 8px}
.timer .run{font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center;color:var(--amber);border-color:var(--amber)}
.spacer{flex:1}
.keys{color:var(--mist2);font-size:12px;white-space:nowrap}

/* menu overlay */
#menu{position:fixed;inset:0 0 58px 0;background:rgba(10,14,30,.94);display:none;overflow:auto;padding:clamp(20px,5vh,60px) clamp(20px,6vw,90px);z-index:7}
#menu.open{display:block}
#menu h2{color:var(--amber);margin-bottom:.6em}
#menu .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 40px}
#menu button.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 4px;color:var(--paper)}
#menu button.item:hover{color:var(--amber)}
#menu button.item small{color:var(--mist2);margin-left:8px}
#menu .grp{font-family:var(--serif);color:var(--mist);margin:14px 0 4px;font-size:1.1em}

@media (max-width:900px){
  .slide.two{grid-template-columns:minmax(0,1fr);align-content:start}
  .paper{max-height:none}
  .tl{grid-template-columns:5em 1fr}
  .tl .dad{grid-column:2}
  .keys,.where{display:none}
  body{font-size:16px}
}
@media print{
  body{overflow:visible;background:#fff;color:#000}
  #bar,#menu,.tn,.rail{display:none!important}
  #stage{position:static}
  .slide{position:static;display:block;padding:0}
  .paper{box-shadow:none;color:#000}
  .rv{display:block!important}
  textarea.write{border:1px solid #999}
}
/* ---- theme shift: school fair ---- */
:root{--night:#1B2A41;--night2:#121D30;--rail:#243650;--line:#34496A;--amber:#FFB443;--amber2:#C47A12;--dusk:#E4572E;--mist:#BCC8DE;--mist2:#8A9BB8}
/* people cards */
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:.6em 0}
.person{background:#fff;border:1px solid var(--paper2);border-left:5px solid var(--amber);border-radius:6px;padding:12px 14px;color:var(--ink);line-height:1.4}
.person b{display:block;font-family:var(--serif);font-size:1.3em;color:var(--ink)}
/* ---- EN31: longer lines, same numbering as the worksheet ---- */
.slide.two{grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr)}
.paper{font-size:clamp(14px,1.02vw,20px);line-height:1.55}
.paper.sans{font-size:clamp(16px,1.25vw,20px)}
.ln{grid-template-columns:2.6em minmax(0,1fr)}
.people{grid-template-columns:repeat(3,minmax(0,1fr))}
.person span{display:block;color:var(--ink2);font-size:.9em;margin-top:.2em}
.lead{list-style:none;padding:0;margin:1em 0 0;font-family:var(--serif);font-size:clamp(20px,2.4vw,34px);line-height:1.5;color:var(--mist)}
.vocab{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.vc{padding:7px 9px}
.vc .w{font-size:.9em;overflow-wrap:anywhere}
@media (max-width:900px){.slide.two{grid-template-columns:minmax(0,1fr)}.people{grid-template-columns:1fr 1fr}}
</style>
</head>

<nav id="bar" aria-label="Navigation">

</nav>

<div id="menu" role="dialog" aria-label="Overview"></div>

<style>
#gate{position:fixed;inset:0;z-index:50;background:var(--night);display:none;align-items:center;justify-content:center;padding:24px}
#gate .box{width:min(460px,100%)}
#gate .eye{color:var(--amber);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
#gate h1{font-size:clamp(30px,5vw,44px);margin:.15em 0 .6em}
#gate .row{display:flex;gap:10px}
#gate input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--rail);color:var(--paper)}
#gate input:focus-visible{outline:3px solid #9BD1FF;outline-offset:2px}
#gate button{padding:12px 20px;border-radius:8px;border:0;background:var(--amber);color:#1C2030;font-weight:700}
#gate p{color:var(--mist);font-size:14px;margin:.9em 0 0}
#gate .shake{animation:gshake .35s}
@keyframes gshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>

const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const get=()=>{try{return localStorage.getItem(LOCK.k)}catch(e){return null}},set=v=>{try{localStorage.setItem(LOCK.k,v)}catch(e){}};
async function unlock(pw){try{const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pw).trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(LOCK.s),iterations:LOCK.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(LOCK.i)},k,b64d(LOCK.c)))}catch(e){return null}}
function run(code,pw){set(pw);const g=document.getElementById('gate');if(g)g.remove();const s=document.createElement('script');s.textContent=code;document.body.appendChild(s)}
(async function(){
  const m=/^#pw=(.+)$/.exec(location.hash);
  if(m){let v=m[1];try{v=decodeURIComponent(v)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}const c=await unlock(v);if(c)return run(c,v)}
  const saved=get();if(saved){const c=await unlock(saved);if(c)return run(c,saved)}
  const g=document.getElementById('gate'),i=document.getElementById('gpw'),msg=document.getElementById('gmsg');g.style.display='flex';i.focus();
  const go=async()=>{const c=await unlock(i.value);if(c)return run(c,i.value);
    msg.textContent=window.crypto&&crypto.subtle?'That is not the password. Try again.':'This browser cannot open the page. Please use Safari or Chrome.';i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake')};
  document.getElementById('ggo').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};
})();
})();
